<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A web app for your notes">
    <meta name="keywords" content="notes todo">
    <meta name="author" content="Elisa Sacchelli">
    <title>My Notes</title>

    <!-- Font awesome kit -->
    <script src="https://kit.fontawesome.com/1af258361d.js" crossorigin="anonymous"></script>

    <!-- JQuery -->
    <script src="../static/scripts/jquery-3.6.3.min.js" defer></script>
    <!-- Custom JS -->
    <script src="../static/scripts/scripts.js" defer></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <div id="logo">
            <h1>My Notes</h1>
            <i class="fa-solid fa-pen-nib"></i>
        </div>

        <nav>
            <button id="options-toggler" aria-controls="options" aria-expanded="false"><i class="fa-solid fa-plus"></i></button>
            <ul id="options">
                <li><a href="{{ url_for('add') }}" class="center-items">Add note</a></li>
                <li><a href="{{ url_for('add') }}" class="center-items">Add list</a></li>
                <li><a href="{{ url_for('add') }}" class="center-items">Dashboard</a></li>
            </ul>
        </nav>

    </header>

    {% block content %}
    {% endblock %}


</body>
</html>
