{% macro noteActions(note) %}
<span class="note-actions-created-at">{{ note.CreatedAt if note else "" }}</span>
<button class="edit-btn" aria-label="edit"><i class="fa-solid fa-pencil"></i></button>
<button class="delete-btn" aria-label="delete"><i class="fa-solid fa-trash-can"></i></button>
{% endmacro %}
