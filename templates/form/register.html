{% extends "form/formWrapper.html" %}

{% block formContent %}
<form id="register" action="{{action}}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if errors %}
    <div id="errorMsg" role="alert">
        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" value="{{ username }}" minlength="3" maxlength="50" pattern="[A-Za-z0-9_]+" autocomplete="username" required><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" value="{{ email }}" maxlength="100" autocomplete="email" required><br>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required><br>
    <label for="confirm_password">Confirm Password:</label><br>
    <input type="password" id="confirm_password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required><br>
    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
{% endblock %}
