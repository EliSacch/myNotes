
{% extends "base.html" %}

{% block content %}
    
<main>

    {% for note in notes %}
        <div class="note">
            <h2 class="note-title">
                {{ note.Title }}
            </h2>
            <div class="note-body">
                <p>Content here</p>
            </div>
            <div class="note-footer">
                <span>18/12/91</span>
                <button class="edit-btn" aria-label="edit"><i class="fa-solid fa-pencil"></i></button>
                <button class="delete-btn" aria-label="delete"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>
    {% endfor %}

</main>
{% endblock %}
