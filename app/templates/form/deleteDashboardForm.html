{% macro deleteDashboardForm(csrf_token) %}
    <form id="deleteDashboardForm" action="" method="post">
        <div class="form-errors error-msg" role="alert" hidden></div>
        <p class="modal-prompt">Are you sure you want to delete this dashboard?</p>
        <small>All notes in this dashboard will be deleted.</small>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    </form>
{% endmacro %}
