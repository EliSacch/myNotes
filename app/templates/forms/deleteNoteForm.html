{% macro deleteNoteForm(csrf_token) %}
    <form id="deleteNoteForm" action="" method="post">
        <div class="form-errors error-msg" role="alert" hidden></div>
        <p class="modal-prompt">Are you sure you want to delete this note?</p>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    </form>
{% endmacro %}
