{% from "macros/tooltip.html" import tooltip %}
{% macro noteFormActions() %}
    <div class="note-action-buttons">
        {{ tooltip('<button type="button"
            aria-label="Cancel"
            class="note-form-button-cancel cancel-btn">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>', 'Cancel', 'bottom') }}
    {{ tooltip('<button type="submit"
        aria-label="Save note"
        class="note-form-button-save save-btn"
        data-loading-text="Saving note...">
        <span class="btn-label">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
        </span>
        <span class="btn-loading" hidden>
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <span class="btn-loading-text visually-hidden">Saving note...</span>
        </span>
        </button>', 'Save', 'bottom') }}
    </div>
{% endmacro %}
