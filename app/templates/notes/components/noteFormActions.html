{% macro noteFormActions() %}
<div class="note-action-buttons">
    <button type="button" aria-label="Cancel" class="note-form-button-cancel delete-btn">
        <i class="fa-solid fa-trash-can"></i>
    </button>
    
    <button type="submit" aria-label="Save" class="note-form-button-save save-btn">
        <i class="fa-solid fa-floppy-disk"></i>
    </button>
</div>
{% endmacro %}
