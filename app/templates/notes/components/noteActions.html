{% from "components/tooltip.html" import tooltip %}

{% macro noteActions(note, csrf_token) %}
    <span class="note-actions-created-at">{{ note.created_at if note else "" }}</span>

    <div class="note-action-buttons">
        <form
            class="note-delete-form"
            action="{{ url_for('notes.delete_note', note_id=note.id) }}"
            method="POST"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {{ tooltip('<button type="submit" class="delete-btn" aria-label="delete">
                <i class="fa-solid fa-trash-can"></i>
            </button>', 'Delete', 'bottom') }}
            
        </form>
        {{ tooltip('<button type="button" class="edit-btn" aria-label="edit"><i class="fa-solid fa-pencil"></i></button>', 'Edit', 'bottom') }}
        
    </div>
{% endmacro %}
