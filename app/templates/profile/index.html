{% extends "base.html" %}
{% from "macros/modal.html" import modal %}
{% block content %}
    <main id="main-content" class="center-items column">
        <section class="profile-info center-items column">
            <h1>{{ user.username }}</h1>
            <p>{{ user.email }}</p>
        </section>
        <section class="profile-footer center-items column">
            {% if user.is_authenticated %}
                <button
                    type="button"
                    class="center-items modal-trigger base-button link"
                    data-modal="logoutModal"
                    aria-label="Logout"
                    >
                    Logout
                </button>
            {% endif %}
        </section>
        {{ modal('logoutModal', 'Logout', 'Are you sure you want to logout?', confirm_action='logout') }}
    </main>
{% endblock %}
