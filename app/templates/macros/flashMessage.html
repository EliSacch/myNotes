{% macro flash_messages(messages, category="info") %}
{% if messages %}
    <div id="messages">
        {% for category, message in messages %}
        <div class="message {{ category }}">
            {{ message }}
            <button class="close-button" aria-label="Close message" onclick="this.parentElement.remove()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        {% endfor %}
    </div>
{% endif %}
{% endmacro %}
