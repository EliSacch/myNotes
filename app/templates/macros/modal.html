{% from "macros/button.html" import button %}

{% macro render_modal(id, title, content, confirmAction) -%}
<div class="overlay fade" id="{{ id }}" role="dialog" aria-modal="true" aria-labelledby="{{ id }}-title" aria-hidden="true" inert>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h1 id="{{ id }}-title">{{ title }}</h1>
                <button type="button" class="modal-close" aria-label="Close">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="modal-body">
                {{ content }}
            </div>
            <div class="modal-footer">
                {{ button('Cancel', '', 'secondary modal-close') }}
                {{ button(confirmAction or 'Confirm', 'Confirming...') }}
            </div>
        </div>
    </div>
</div>
{%- endmacro %}
